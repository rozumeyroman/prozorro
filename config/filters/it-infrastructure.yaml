# Профіль "it-infrastructure": кібербезпека, мережі, сервери (широкий). Опис логіки: docs/tender-filter.md
#
# Тендер вважається релевантним, якщо:
#   1) процедура проходить попередній фільтр за даними фіду (тип процедури, тип замовника, сума лотів);
#   2) хоча б одна позиція (item) відповідає темі: за "сильним" CPV або за "слабким" CPV разом із ключовим словом;
#   3) очікувана вартість (лотів з релевантними позиціями або всього тендера) >= min_value.

description: "ІТ-інфраструктура: кібербезпека, мережеве та серверне обладнання (широкий профіль)"

min_value:
  amount: 500000          # грн
  currency: UAH           # тендери в інших валютах поки пропускаються
  scope: relevant_lots    # relevant_lots | tender
                          #   relevant_lots: сума лотів, у яких є релевантні позиції (для тендера без лотів це вартість тендера)
                          #   tender: вартість усього тендера

# Попередній фільтр за полями фіду (opt_fields), до завантаження повного тендера
feed_prefilter:
  procurement_method_types:
    include:
      - aboveThreshold
      - aboveThresholdUA
      - aboveThresholdEU
      - aboveThresholdUA.defense
      - simple.defense
      - competitiveOrdering
      - competitiveDialogueUA
      - competitiveDialogueEU
      - competitiveDialogueUA.stage2
      - competitiveDialogueEU.stage2
      - closeFrameworkAgreementUA
      - closeFrameworkAgreementSelectionUA
      - priceQuotation
      - requestForProposal
      - negotiation
      - negotiation.quick
      - belowThreshold     # див. only_for_entity_kinds
      # - reporting        # прямі договори без процедури: корисні для аналізу цін, але їх дуже багато; вмикати свідомо
    only_for_entity_kinds:
      # Спрощені закупівлі (belowThreshold) для загальних замовників обмежені 200 тис. грн (товари/послуги),
      # тому для порогу 500 тис. беремо їх лише в "особливих" замовників (поріг до 1 млн).
      belowThreshold: [special]
  skip_statuses: [draft, draft.pending, draft.unsuccessful, draft.stage2]

# Сильні CPV: збіг коду позиції з кодом або будь-яким його підкодом означає релевантність
cpv_strong:
  network:
    - 32400000-7   # Мережі (локальні, комунікаційні, маршрутизатори, мережеве обладнання, концентратори...)
    - 32581000-9   # Обладнання для передачі даних
    - 48210000-3   # Пакети мережевого програмного забезпечення
    - 50312300-8   # ТО і ремонт обладнання мереж для передачі даних
    - 72315000-6   # Керування мережами даних і їх підтримка
    - 72511000-0   # ПЗ для керування мережами (послуги)
    - 72700000-7   # Послуги у сфері комп'ютерних мереж
  servers_storage:
    - 48820000-2   # Сервери
    - 30233141-1   # RAID-масиви
  cybersecurity:
    - 48730000-4   # ПЗ для забезпечення безпеки (захист файлів, даних)
    - 48760000-3   # ПЗ для захисту від вірусів
    - 72212731-2   # Розробка ПЗ для захисту файлів
    - 72212732-9   # Розробка ПЗ для захисту даних
    - 72212760-4   # Розробка ПЗ для захисту від вірусів
    - 72150000-1   # Консультації з комп'ютерного аудиту та апаратного забезпечення
    - 72800000-8   # Комп'ютерний аудит і тестування

# Слабкі CPV: широкі групи, де наші товари трапляються разом з чужими.
# Позиція релевантна, лише якщо її опис (або назва тендера чи лоту) містить ключове слово.
cpv_weak:
  - 30200000-1     # Комп'ютерне обладнання та приладдя (сервери часто купують саме тут)
  - 30233000-1     # Пристрої для зберігання даних
  - 48000000-8     # Пакети ПЗ та інформаційні системи (усе, що не в cpv_strong)
  - 72000000-5     # ІТ-послуги (усе, що не в cpv_strong)
  - 32500000-8     # Телекомунікаційне обладнання
  - 50300000-8     # Ремонт і ТО комп'ютерного та телеком обладнання
  - 79417000-0     # Консультаційні послуги з питань безпеки (часто фізична охорона)

# Коди, які не підходять ніколи (разом з підкодами), навіть якщо входять в основні чи загальні гілки.
# Аналіз і пояснення: docs/cpv-codes.md, розділ 6.
cpv_exclude:
  # комплектуючі, ПК, периферія, носії
  - 30213000-5   # ПК, ноутбуки, планшети
  - 30214000-2   # Робочі станції
  - 30211500-6   # Процесори (CPU)
  - 30212100-9   # Процесори для мінікомп'ютерів
  - 30213400-9   # Процесори для ПК
  - 30215100-0   # Процесори для мікрокомп'ютерів
  - 30216000-6   # Зчитувачі, сканери, сканери штрих-кодів
  - 30220000-7   # Цифрове картографічне обладнання
  - 30231000-7   # Монітори, термінали, консолі
  - 30232000-4   # Принтери, плотери, периферія
  - 30233130-1   # Жорсткі диски (накопичувачі на магнітних дисках)
  - 30233150-7   # Оптичні приводи CD/DVD
  - 30233180-6   # Флеш-накопичувачі
  - 30233190-9   # Дискові контролери
  - 30233300-4   # Зчитувачі смарт-карток і відбитків пальців
  - 30234000-8   # Носії інформації: диски, стрічки, флеш-пам'ять
  - 30236100-3   # Модулі пам'яті: RAM, ROM
  - 30237000-9   # Частини та аксесуари: плати, адаптери, блоки живлення, картриджі, клавіатури, миші
  - 30238000-6   # Бібліотечне обладнання
  # кабелі, телефонія, радіо, супутник, факси
  - 32421000-0   # Мережеві кабелі
  - 32416000-2   # Мережі ISDN
  - 32418000-6   # Радіомережі
  - 32426000-5   # Мережеві видавничі системи
  - 32429000-6   # Обладнання для телефонних мереж
  - 32440000-9   # Телеметричне та термінальне обладнання: муфти, термінальні блоки, контактні плати
  - 32521000-1   # Телекомунікаційні кабелі
  - 32530000-7   # Супутникове обладнання
  - 32550000-3   # Телефонне обладнання
  - 32560000-6   # Оптоволоконні матеріали та кабелі
  - 32572000-3   # Комунікаційні кабелі
  - 32581100-0   # Кабелі для передачі даних
  - 32581200-1   # Факсимільне обладнання
  - 32582000-6   # Носії даних
  - 32583000-3   # Носії для зберігання даних
  - 32584000-0   # Носії із записаними даними
  - 31310000-2   # Силові «мережеві кабелі»
  # прикладне ПЗ не за темою
  - 48100000-9   # Галузеве ПЗ: авіація, залізниця, медицина, бібліотеки, освіта, виробництво
  - 48300000-1   # Документообіг, графіка, САПР, офісне ПЗ
  - 48400000-2   # Бухгалтерія, ERP, CRM, фінанси, кадри, бізнес-аналітика
  - 48520000-9   # Мультимедійне ПЗ
  - 48720000-1   # Сканування штрих-кодів
  - 48740000-7   # Перекладацьке ПЗ
  - 48750000-0   # Запис на носії
  - 48773000-7   # Друк
  - 48812000-3   # Фінансові інформаційні системи
  - 48813000-0   # Пасажирські інформаційні системи, табло
  - 48814000-7   # Медичні інформаційні системи
  - 48910000-0   # Ігри, заставки
  - 48930000-6   # Навчальне та розважальне ПЗ
  - 48940000-9   # Шаблони, календарі
  - 48950000-2   # Системи визначення координат суден, гучномовний зв'язок
  - 48970000-8   # Типографське ПЗ
  # послуги не за темою
  - 72212910-1   # Розробка ігор
  - 72212930-7   # Розробка навчального та розважального ПЗ
  - 72311000-8   # Обробка даних: електронні таблиці, перетворення, пакетна обробка
  - 72312000-5   # Введення та підготовка даних, OCR
  - 72330000-2   # Стандартизація та класифікація контенту
  - 72411000-4   # Інтернет-провайдери
  - 72413000-8   # Розробка веб-сайтів
  - 72414000-5   # Пошукові системи
  - 72417000-6   # Доменні імена
  - 50311000-8   # ТО офісної обчислювальної техніки, калькуляторів
  - 50313000-2   # ТО копіювальної техніки
  - 50314000-9   # ТО факсів
  - 50315000-6   # ТО автовідповідачів
  - 50316000-3   # ТО пристроїв друку квитків
  - 50317000-0   # ТО валідаторів квитків
  - 50320000-4   # Ремонт і ТО персональних комп'ютерів і периферії
  - 50333000-8   # ТО обладнання радіозв'язку
  - 50334000-5   # ТО телефонного та телеграфного зв'язку
  - 50340000-0   # ТО аудіовізуального та оптичного обладнання

# Ключові слова: регулярні вирази без урахування регістру; перевіряються в описі позиції, назві лоту і тендера
keywords:
  include:
    - 'сервер'
    - '\bСХД\b'
    - 'систем\w* зберігання даних'
    - 'дисков\w* масив'
    - '\b(NAS|SAN)\b'
    - 'комутатор'
    - 'маршрутизатор'
    - 'роутер'
    - '\bswitch'
    - 'точк\w* доступу'
    - 'мережев\w* обладнан'
    - 'firewall|файрвол|брандмауер|міжмережев\w* екран'
    - '\b(NGFW|UTM|VPN|SIEM|SOC|EDR|XDR|IDS|IPS|WAF|DLP|PAM|NAC)\b'
    - 'антивірус'
    - 'кібер'
    - 'захист\w* інформац'
    - '\bКСЗІ\b'
    - 'тестуван\w* на проникнен|пентест'
    - 'шифруван|криптограф'
    # бренди (доповнюйте під свій асортимент)
    - '\b(Cisco|Fortinet|FortiGate|Palo Alto|Check ?Point|Juniper|MikroTik|Aruba|Ubiquiti|Sophos|ESET|Zyxel|Allied Telesis|Extreme Networks)\b'
    - '\b(Supermicro|PowerEdge|ProLiant|ThinkSystem|NetApp|Synology|QNAP)\b'
  # Початок опису позиції, з яким вона не підходить за будь-якого коду: кабелі, пам'ять, диски, кріплення,
  # які замовники ставлять під загальні коди (32420000-3, 30230000-0 тощо)
  exclude_items:
    - 'кабел|cable|патч-?корд|patch[- ]?cord|шнур|подовжувач'
    - 'коннектор|конектор|роз.єм|розетк|патч-?панел|органайзер|термоусад|стяжк'
    - 'модул\w* (оперативної )?пам|оперативн\w* пам|пам.ять\b|\bDDR\d|\bRAM\b|memory\b'
    - 'жорстк\w* диск|твердотіл\w* накопич|накопичувач\w* (SSD|HDD)|\b(SSD|HDD|NVMe)\b|диск\w* (SSD|HDD|SAS|SATA)'
    - 'блок\w* живлення|power supply|\bPSU\b|акумулятор|батаре'
    - 'вентилятор|кулер|радіатор|процесор|\bCPU\b|материнськ|відеокарт'
    - 'кріплен|рейк|салазк|rail kit|кронштейн|полиц|шаф[аиу]\b|стійк[аиу]\b'
  exclude:
    # відкидають позицію лише на "слабкому" шляху
    - 'картридж|тонер'
    - 'електромереж|електричн\w* мереж'
