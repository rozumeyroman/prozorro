# Профіль "it-infrastructure": кібербезпека, мережі, сервери (широкий). Опис логіки: docs/tender-filter.md
#
# Тендер вважається релевантним, якщо:
#   1) процедура проходить попередній фільтр за даними фіду (тип процедури, тип замовника, сума лотів);
#   2) хоча б одна позиція (item) відповідає темі: за "сильним" CPV або за "слабким" CPV разом із ключовим словом;
#   3) очікувана вартість (лотів з релевантними позиціями або всього тендера) >= min_value.

description: "ІТ-інфраструктура: кібербезпека, мережеве та серверне обладнання (широкий профіль)"

min_value:
  amount: 500000          # грн
  currency: UAH           # тендери в інших валютах поки пропускаються
  scope: relevant_lots    # relevant_lots | tender
                          #   relevant_lots: сума лотів, у яких є релевантні позиції (для тендера без лотів це вартість тендера)
                          #   tender: вартість усього тендера

# Попередній фільтр за полями фіду (opt_fields), до завантаження повного тендера
feed_prefilter:
  procurement_method_types:
    include:
      - aboveThreshold
      - aboveThresholdUA
      - aboveThresholdEU
      - aboveThresholdUA.defense
      - simple.defense
      - competitiveOrdering
      - competitiveDialogueUA
      - competitiveDialogueEU
      - competitiveDialogueUA.stage2
      - competitiveDialogueEU.stage2
      - closeFrameworkAgreementUA
      - closeFrameworkAgreementSelectionUA
      - priceQuotation
      - requestForProposal
      - negotiation
      - negotiation.quick
      - belowThreshold     # див. only_for_entity_kinds
      # - reporting        # прямі договори без процедури: корисні для аналізу цін, але їх дуже багато; вмикати свідомо
    only_for_entity_kinds:
      # Спрощені закупівлі (belowThreshold) для загальних замовників обмежені 200 тис. грн (товари/послуги),
      # тому для порогу 500 тис. беремо їх лише в "особливих" замовників (поріг до 1 млн).
      belowThreshold: [special]
  skip_statuses: [draft, draft.pending, draft.unsuccessful, draft.stage2]

# Сильні CPV: збіг коду позиції з кодом або будь-яким його підкодом означає релевантність
cpv_strong:
  network:
    - 32400000-7   # Мережі (локальні, комунікаційні, маршрутизатори, мережеве обладнання, концентратори...)
    - 32581000-9   # Обладнання для передачі даних
    - 32562300-3   # Оптоволоконні кабелі для передачі даних
    - 30237110-3   # Мережеві інтерфейси
    - 30237135-4   # Мережеві адаптери
    - 48210000-3   # Пакети мережевого програмного забезпечення
    - 50312300-8   # ТО і ремонт обладнання мереж для передачі даних
    - 72315000-6   # Керування мережами даних і їх підтримка
    - 72511000-0   # ПЗ для керування мережами (послуги)
    - 72700000-7   # Послуги у сфері комп'ютерних мереж
  servers_storage:
    - 48820000-2   # Сервери
    - 30233141-1   # RAID-масиви
  cybersecurity:
    - 48730000-4   # ПЗ для забезпечення безпеки (захист файлів, даних)
    - 48760000-3   # ПЗ для захисту від вірусів
    - 72212731-2   # Розробка ПЗ для захисту файлів
    - 72212732-9   # Розробка ПЗ для захисту даних
    - 72212760-4   # Розробка ПЗ для захисту від вірусів
    - 72150000-1   # Консультації з комп'ютерного аудиту та апаратного забезпечення
    - 72800000-8   # Комп'ютерний аудит і тестування

# Слабкі CPV: широкі групи, де наші товари трапляються разом з чужими.
# Позиція релевантна, лише якщо її опис (або назва тендера чи лоту) містить ключове слово.
cpv_weak:
  - 30200000-1     # Комп'ютерне обладнання та приладдя (сервери часто купують саме тут)
  - 30233000-1     # Пристрої для зберігання даних
  - 48000000-8     # Пакети ПЗ та інформаційні системи (усе, що не в cpv_strong)
  - 72000000-5     # ІТ-послуги (усе, що не в cpv_strong)
  - 32500000-8     # Телекомунікаційне обладнання
  - 31310000-2     # "Мережеві кабелі" (часто електромережі)
  - 50300000-8     # Ремонт і ТО комп'ютерного та телеком обладнання
  - 79417000-0     # Консультаційні послуги з питань безпеки (часто фізична охорона)

# Ключові слова: регулярні вирази без урахування регістру; перевіряються в описі позиції, назві лоту і тендера
keywords:
  include:
    - 'сервер'
    - '\bСХД\b'
    - 'систем\w* зберігання даних'
    - 'дисков\w* масив'
    - '\b(NAS|SAN)\b'
    - 'комутатор'
    - 'маршрутизатор'
    - 'роутер'
    - '\bswitch'
    - 'точк\w* доступу'
    - 'мережев\w* обладнан'
    - 'firewall|файрвол|брандмауер|міжмережев\w* екран'
    - '\b(NGFW|UTM|VPN|SIEM|SOC|EDR|XDR|IDS|IPS|WAF|DLP|PAM|NAC)\b'
    - 'антивірус'
    - 'кібер'
    - 'захист\w* інформац'
    - '\bКСЗІ\b'
    - 'тестуван\w* на проникнен|пентест'
    - 'шифруван|криптограф'
    # бренди (доповнюйте під свій асортимент)
    - '\b(Cisco|Fortinet|FortiGate|Palo Alto|Check ?Point|Juniper|MikroTik|Aruba|Ubiquiti|Sophos|ESET|Zyxel|Allied Telesis|Extreme Networks)\b'
    - '\b(Supermicro|PowerEdge|ProLiant|ThinkSystem|NetApp|Synology|QNAP)\b'
  exclude:
    # відкидають позицію лише на "слабкому" шляху
    - 'картридж|тонер'
    - 'електромереж|електричн\w* мереж'
